global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [prometheus:9090]

  - job_name: api-gateway
    metrics_path: /metrics
    static_configs:
      - targets: [api-gateway:4080]

  - job_name: api-readiness
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://identity-api:4001/health/ready
          - http://patients-api:4002/health/ready
          - http://catalogs-api:4003/health/ready
          - http://subscriptions-api:4004/health/ready
          - http://clinical-api:4005/health/ready
          - http://measurements-api:4006/health/ready
          - http://nutrition-api:4007/health/ready
          - http://planning-api:4008/health/ready
          - http://scheduling-api:4009/health/ready
          - http://notifications-api:4010/health/ready
          - http://documents-api:4011/health/ready
          - http://reporting-api:4012/health/ready
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: database-connectivity
    metrics_path: /probe
    params:
      module: [tcp_connect]
    static_configs:
      - targets: [identity-db:1433, patients-db:1433, catalogs-db:1433, platform-db:1433]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: rabbitmq
    static_configs:
      - targets: [rabbitmq:15692]

  - job_name: otel-collector
    static_configs:
      - targets: [otel-collector:8888]
