openapi: 3.1.0
info:
  title: Nutrimejor Notifications API
  version: 1.1.0
  description: Preferencias, trabajos multicanal, reintentos y cola de fallos.
security:
  - bearerAuth: []
    serviceTimestamp: []
    serviceNonce: []
    serviceSignature: []
paths:
  /health/live:
    get:
      security: []
      responses:
        '200': { description: Proceso activo }
  /health/ready:
    get:
      security: []
      responses:
        '200': { description: Servicio listo }
  /v1/notifications:
    get:
      parameters:
        - in: query
          name: patientId
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Listado }
    post:
      responses:
        '201': { description: Creado }
  /v1/notifications/{id}:
    get:
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Encontrado }
        '404': { description: No encontrado }
    put:
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Actualizado }
  /v1/notifications/{id}/status:
    post:
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Estado actualizado }
  /v1/preferences:
    post:
      responses:
        '200': { description: Preferencia creada o actualizada }
  /v1/preferences/patients/{patientId}:
    parameters:
      - in: path
        name: patientId
        required: true
        schema: { type: string, format: uuid }
    get:
      responses:
        '200': { description: Preferencias por canal del paciente }
  /v1/notification-jobs:
    get:
      parameters:
        - in: query
          name: patientId
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Trabajos y estado de entrega }
    post:
      responses:
        '201': { description: Trabajo encolado }
  /v1/alert-rules:
    get:
      responses:
        '200':
          description: Reglas configurables de la organización
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/AlertRule' } }
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AlertRuleInput' }
      responses:
        '201': { description: Regla de alerta creada }
        '403': { description: Requiere automatizaciones habilitadas }
  /v1/alert-rules/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    put:
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AlertRuleInput' }
      responses:
        '200': { description: Regla actualizada }
        '404': { description: Regla no encontrada en la organización }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
    serviceTimestamp: { type: apiKey, in: header, name: x-service-timestamp }
    serviceNonce: { type: apiKey, in: header, name: x-service-nonce }
    serviceSignature: { type: apiKey, in: header, name: x-service-signature }
  schemas:
    AlertRuleInput:
      type: object
      required: [name, ruleType, channels]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 2, maxLength: 200 }
        ruleType:
          type: string
          enum: [patient_without_follow_up, upcoming_appointment, expiring_meal_plan, missed_appointment, incomplete_patient_data, pending_lab, pending_anthropometry, pending_review]
        conditions: { type: object, additionalProperties: true }
        channels:
          type: array
          minItems: 1
          maxItems: 4
          items: { type: string, enum: [in_app, email, sms, whatsapp] }
        leadMinutes: { type: integer, minimum: 0, maximum: 525600 }
        enabled: { type: boolean }
    AlertRule:
      allOf:
        - $ref: '#/components/schemas/AlertRuleInput'
        - type: object
          required: [id, createdAt, updatedAt]
          properties:
            id: { type: string, format: uuid }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
