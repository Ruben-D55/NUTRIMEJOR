openapi: 3.1.0
info:
  title: Nutrimejor Reporting API
  version: 1.1.0
  description: Snapshots, métricas y líneas de tiempo construidas desde eventos idempotentes.
paths:
  /health/live:
    get:
      responses:
        '200': { description: Proceso activo }
  /health/ready:
    get:
      responses:
        '200': { description: Servicio listo }
  /v1/report-snapshots:
    get:
      parameters:
        - in: query
          name: patientId
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Listado }
    post:
      responses:
        '201': { description: Creado }
  /v1/report-snapshots/{id}:
    get:
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Encontrado }
        '404': { description: No encontrado }
    put:
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Actualizado }
  /v1/report-snapshots/{id}/status:
    post:
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Estado actualizado }
  /v1/dashboards/organization:
    get:
      summary: Devuelve series diarias para gráficos de la organización
      parameters:
        - in: query
          name: from
          schema: { type: string, format: date }
        - in: query
          name: to
          schema: { type: string, format: date }
      responses:
        '200':
          description: Series agrupadas por dominio y tipo de evento
        '403': { description: Rol sin acceso }
  /v1/dashboards/patients/{patientId}:
    get:
      summary: Devuelve estado por dominio y línea de tiempo del paciente
      parameters:
        - in: path
          name: patientId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Resumen y hasta 200 eventos recientes }
        '403': { description: Rol sin acceso }
  /v1/projections/rebuild:
    post:
      summary: Reconstruye los modelos de lectura desde el inbox durable
      responses:
        '200': { description: Proyecciones reconstruidas }
        '403': { description: Requiere rol OWNER o ADMIN }
