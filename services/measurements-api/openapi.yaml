openapi: 3.1.0
info:
  title: NUTRIMEJOR Measurements API
  version: 1.2.0
  description: Antropometría básica, signos vitales, laboratorios y cálculos reproducibles.
security:
  - serviceKey: []
    bearerAuth: []
paths:
  /v1/sport/evaluators:
    post:
      summary: Registra un evaluador acreditado ISAK 1 o 2
      responses:
        '201': { description: Evaluador registrado }
        '403': { description: Requiere membresía Sport }
  /v1/sport/assessments:
    post:
      summary: Registra una evaluación deportiva trazable
      responses:
        '201': { description: Evaluación con cálculos versionados }
        '422': { description: Nivel ISAK insuficiente }
  /v1/sport/assessments/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    get:
      responses:
        '200': { description: 'Evaluación, mediciones, evaluador y fórmulas' }
        '404': { description: No encontrada en la organización }
  /v1/sport/patients/{patientId}/comparison:
    parameters:
      - in: path
        name: patientId
        required: true
        schema: { type: string, format: uuid }
    get:
      responses:
        '200': { description: Comparación deportiva inicial y actual }
  /health/live:
    get:
      security: []
      responses:
        '200': { description: Proceso activo }
  /health/ready:
    get:
      security: []
      responses:
        '200': { description: Servicio listo }
  /v1/measurement-sessions:
    get:
      parameters:
        - in: query
          name: patientId
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Sesiones registradas de la organización
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/SessionSummary' } }
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SessionInput' }
      responses:
        '201':
          description: Sesión registrada de forma inmutable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '400': { description: Datos o unidades incompatibles }
  /v1/measurement-sessions/{id}:
    get:
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Sesión con mediciones, laboratorios y cálculos
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '404': { description: Sesión no encontrada }
  /v1/patients/{patientId}/measurements/comparison:
    get:
      parameters:
        - in: path
          name: patientId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Comparación inicial contra actual
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Comparison' } }
  /v1/migrations/patient-measurements:
    post:
      description: Importación idempotente de peso y altura heredados de Patients.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LegacyMeasurementInput' }
      responses:
        '200': { description: Resultado de importación }
components:
  securitySchemes:
    serviceKey:
      type: apiKey
      in: header
      name: x-service-key
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    AnthropometricMeasurement:
      type: object
      required: [type, value, unit]
      additionalProperties: false
      properties:
        type:
          type: string
          enum: [weight, height, waist, hip, arm_circumference]
        value: { type: number, exclusiveMinimum: 0, maximum: 1000 }
        unit:
          type: string
          description: weight usa kg; height y circunferencias usan cm.
        side: { type: [string, 'null'], enum: [left, right, midline, null] }
        method: { type: [string, 'null'], maxLength: 160 }
        equipment: { type: [string, 'null'], maxLength: 160 }
    VitalSign:
      type: object
      required: [type, value, unit]
      additionalProperties: false
      properties:
        type:
          type: string
          enum: [blood_pressure_systolic, blood_pressure_diastolic, heart_rate, temperature, oxygen_saturation, custom]
        name: { type: [string, 'null'], maxLength: 120 }
        value: { type: number }
        unit:
          type: string
          description: Presión mmHg, frecuencia bpm, temperatura °C y saturación %.
        method: { type: [string, 'null'], maxLength: 160 }
        equipment: { type: [string, 'null'], maxLength: 160 }
    AdvancedAnthropometricMeasurement:
      type: object
      required: [category, code, value, unit]
      additionalProperties: false
      properties:
        category:
          type: string
          enum: [circumference, skinfold, diameter, length, segment]
        code: { type: string, pattern: '^[a-z][a-z0-9_]{1,79}$' }
        value: { type: number, exclusiveMinimum: 0, maximum: 1000 }
        unit: { type: string, enum: [mm, cm] }
        side: { type: [string, 'null'], enum: [left, right, midline, null] }
        method: { type: [string, 'null'], maxLength: 160 }
        equipment: { type: [string, 'null'], maxLength: 160 }
    BodyCompositionResult:
      type: object
      required: [indicator, value, unit, method]
      additionalProperties: false
      properties:
        indicator:
          type: string
          enum: [body_fat_percent, fat_mass_kg, fat_free_mass_kg, muscle_mass_kg, body_water_percent, bone_mass_kg, custom]
        name: { type: [string, 'null'], maxLength: 160 }
        value: { type: number }
        unit: { type: string, minLength: 1, maxLength: 20 }
        method: { type: string, minLength: 2, maxLength: 160 }
        equipment: { type: [string, 'null'], maxLength: 160 }
        formulaCode: { type: [string, 'null'], maxLength: 80 }
        formulaVersion: { type: [string, 'null'], maxLength: 30 }
        formulaSource: { type: [string, 'null'], maxLength: 500 }
        inputs: { type: [object, 'null'], additionalProperties: true }
        notes: { type: [string, 'null'], maxLength: 500 }
    LabResult:
      type: object
      required: [parameter, result, unit]
      properties:
        parameter: { type: string, minLength: 1, maxLength: 160 }
        result: { type: number }
        unit: { type: string, minLength: 1, maxLength: 40 }
        referenceLow: { type: [number, 'null'] }
        referenceHigh: { type: [number, 'null'] }
        notes: { type: [string, 'null'], maxLength: 500 }
    LabPanel:
      type: object
      required: [name, sampleDate, results]
      properties:
        name: { type: string, minLength: 2, maxLength: 200 }
        laboratory: { type: [string, 'null'], maxLength: 200 }
        sampleDate: { type: string, format: date-time }
        notes: { type: [string, 'null'], maxLength: 1000 }
        results: { type: array, minItems: 1, maxItems: 300, items: { $ref: '#/components/schemas/LabResult' } }
    SessionInput:
      type: object
      required: [patientId, title]
      additionalProperties: false
      properties:
        patientId: { type: string, format: uuid }
        title: { type: string, minLength: 2, maxLength: 200 }
        recordedAt: { type: string, format: date-time }
        method: { type: [string, 'null'], maxLength: 160 }
        equipment: { type: [string, 'null'], maxLength: 160 }
        protocol: { type: [string, 'null'], maxLength: 160 }
        notes: { type: [string, 'null'], maxLength: 1000 }
        measurements:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/AnthropometricMeasurement' }
        advancedMeasurements:
          type: array
          maxItems: 150
          items: { $ref: '#/components/schemas/AdvancedAnthropometricMeasurement' }
        bodyComposition:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/BodyCompositionResult' }
        vitalSigns:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/VitalSign' }
        labPanels:
          type: array
          maxItems: 30
          items: { $ref: '#/components/schemas/LabPanel' }
    SessionSummary:
      type: object
      required: [id, patientId, title, status, recordedAt, version]
      properties:
        id: { type: string, format: uuid }
        patientId: { type: string, format: uuid }
        title: { type: string }
        status: { type: string, const: recorded }
        method: { type: [string, 'null'] }
        equipment: { type: [string, 'null'] }
        protocol: { type: [string, 'null'] }
        notes: { type: [string, 'null'] }
        recordedAt: { type: string, format: date-time }
        version: { type: integer }
    Calculation:
      type: object
      required: [formulaCode, formulaVersion, inputs, result, unit, rounding]
      properties:
        formulaCode: { type: string, enum: [BMI, WAIST_HIP_RATIO] }
        formulaVersion: { type: string }
        inputs: { type: object, additionalProperties: true }
        result: { type: number }
        unit: { type: string }
        rounding: { type: integer }
    Session:
      allOf:
        - $ref: '#/components/schemas/SessionSummary'
        - type: object
          properties:
            measurements: { type: array, items: { $ref: '#/components/schemas/AnthropometricMeasurement' } }
            advancedMeasurements: { type: array, items: { $ref: '#/components/schemas/AdvancedAnthropometricMeasurement' } }
            bodyComposition: { type: array, items: { $ref: '#/components/schemas/BodyCompositionResult' } }
            vitalSigns: { type: array, items: { $ref: '#/components/schemas/VitalSign' } }
            labPanels: { type: array, items: { $ref: '#/components/schemas/LabPanel' } }
            calculations: { type: array, items: { $ref: '#/components/schemas/Calculation' } }
    ComparisonPoint:
      type: object
      required: [value, recordedAt, sessionId]
      properties:
        value: { type: number }
        recordedAt: { type: string, format: date-time }
        sessionId: { type: string, format: uuid }
    Comparison:
      type: object
      required: [metric, unit, initial, current, absoluteChange, direction]
      properties:
        metric: { type: string }
        unit: { type: string }
        initial: { $ref: '#/components/schemas/ComparisonPoint' }
        current: { $ref: '#/components/schemas/ComparisonPoint' }
        absoluteChange: { type: number }
        percentageChange: { type: [number, 'null'] }
        direction: { type: string, enum: [increase, decrease, unchanged] }
    LegacyMeasurementInput:
      type: object
      required: [patientId, legacyKey]
      properties:
        patientId: { type: string, format: uuid }
        legacyKey: { type: string, minLength: 1, maxLength: 160 }
        weightKg: { type: [number, 'null'], exclusiveMinimum: 0 }
        heightCm: { type: [number, 'null'], exclusiveMinimum: 0 }
        recordedAt: { type: [string, 'null'], format: date-time }
        source: { type: string, default: patients-db }
