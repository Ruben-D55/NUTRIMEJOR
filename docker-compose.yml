name: nutrimejor

x-sql-environment: &sql-environment
  ACCEPT_EULA: "Y"
  MSSQL_PID: "Express"
  MSSQL_MEMORY_LIMIT_MB: "1024"

x-api-common: &api-common
  restart: unless-stopped
  healthcheck:
    test: ["CMD", "node", "-e", "fetch('http://localhost:'+process.env.PORT+'/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
    interval: 10s
    timeout: 3s
    retries: 10
  environment:
    DB_USER: sa
    DB_PORT: 1433
    DB_ENCRYPT: "false"
    DB_TRUST_CERTIFICATE: "true"
    SERVICE_API_KEY: ${SERVICE_API_KEY:?Ejecuta npm run setup:env}
    RUN_MIGRATIONS_ON_STARTUP: ${RUN_MIGRATIONS_ON_STARTUP:-true}

services:
  identity-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: unless-stopped
    environment:
      <<: *sql-environment
      MSSQL_SA_PASSWORD: ${IDENTITY_DB_PASSWORD:?Ejecuta npm run setup:env}
    ports:
      - "127.0.0.1:14331:1433"
    volumes:
      - identity_data:/var/opt/mssql

  patients-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: unless-stopped
    environment:
      <<: *sql-environment
      MSSQL_SA_PASSWORD: ${PATIENTS_DB_PASSWORD:?Ejecuta npm run setup:env}
    ports:
      - "127.0.0.1:14332:1433"
    volumes:
      - patients_data:/var/opt/mssql

  catalogs-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: unless-stopped
    environment:
      <<: *sql-environment
      MSSQL_SA_PASSWORD: ${CATALOGS_DB_PASSWORD:?Ejecuta npm run setup:env}
    ports:
      - "127.0.0.1:14333:1433"
    volumes:
      - catalogs_data:/var/opt/mssql

  platform-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    profiles: ["full"]
    restart: unless-stopped
    environment:
      <<: *sql-environment
      MSSQL_MEMORY_LIMIT_MB: "1536"
      MSSQL_SA_PASSWORD: ${PLATFORM_DB_PASSWORD:?Ejecuta npm run setup:env}
    ports:
      - "127.0.0.1:14334:1433"
    volumes:
      - platform_data:/var/opt/mssql

  rabbitmq:
    image: rabbitmq:4-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-nutrimejor}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Ejecuta npm run setup:env}
    command: ["sh", "-c", "rabbitmq-plugins enable --offline rabbitmq_prometheus && rabbitmq-server"]
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  redis:
    image: redis:8-alpine
    profiles: ["full"]
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data

  identity-api:
    <<: *api-common
    build: ./services/identity-api
    depends_on:
      - identity-db
    environment:
      DB_SERVER: identity-db
      DB_PORT: 1433
      DB_NAME: NutrimejorIdentity
      JWT_PRIVATE_KEY_PATH: /data/jwt-private.pem
      JWT_PUBLIC_KEY_PATH: /data/jwt-public.pem
      EXPOSE_DEVELOPMENT_TOKENS: ${EXPOSE_DEVELOPMENT_TOKENS:-false}
      ACCESS_TOKEN_MINUTES: ${ACCESS_TOKEN_MINUTES:-10}
      REFRESH_TOKEN_DAYS: ${REFRESH_TOKEN_DAYS:-7}
      DB_USER: sa
      DB_PASSWORD: ${IDENTITY_DB_PASSWORD:?Ejecuta npm run setup:env}
      DB_ENCRYPT: "false"
      DB_TRUST_CERTIFICATE: "true"
      DB_POOL_MAX: 10
      SERVICE_API_KEY: ${SERVICE_API_KEY:?Ejecuta npm run setup:env}
      RUN_MIGRATIONS_ON_STARTUP: ${RUN_MIGRATIONS_ON_STARTUP:-true}
    volumes:
      - identity_keys:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4001/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 10

  patients-api:
    <<: *api-common
    build: ./services/patients-api
    depends_on:
      identity-api:
        condition: service_healthy
      patients-db:
        condition: service_started
      rabbitmq:
        condition: service_started
    environment:
      DB_SERVER: patients-db
      DB_PORT: 1433
      DB_NAME: NutrimejorPatients
      DB_USER: sa
      DB_PASSWORD: ${PATIENTS_DB_PASSWORD:?Ejecuta npm run setup:env}
      DB_ENCRYPT: "false"
      DB_TRUST_CERTIFICATE: "true"
      DB_POOL_MAX: 15
      IDENTITY_API_URL: http://identity-api:4001
      IDENTITY_TIMEOUT_MS: 3000
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-nutrimejor}:${RABBITMQ_PASSWORD:?Ejecuta npm run setup:env}@rabbitmq:5672
      SERVICE_API_KEY: ${SERVICE_API_KEY:?Ejecuta npm run setup:env}
      RUN_MIGRATIONS_ON_STARTUP: ${RUN_MIGRATIONS_ON_STARTUP:-true}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4002/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 10

  catalogs-api:
    <<: *api-common
    build: ./services/catalogs-api
    depends_on:
      identity-api:
        condition: service_healthy
      catalogs-db:
        condition: service_started
    environment:
      DB_SERVER: catalogs-db
      DB_PORT: 1433
      DB_NAME: NutrimejorCatalogs
      DB_USER: sa
      DB_PASSWORD: ${CATALOGS_DB_PASSWORD:?Ejecuta npm run setup:env}
      DB_ENCRYPT: "false"
      DB_TRUST_CERTIFICATE: "true"
      DB_POOL_MAX: 10
      IDENTITY_API_URL: http://identity-api:4001
      IDENTITY_TIMEOUT_MS: 3000
      SERVICE_API_KEY: ${SERVICE_API_KEY:?Ejecuta npm run setup:env}
      RUN_MIGRATIONS_ON_STARTUP: ${RUN_MIGRATIONS_ON_STARTUP:-true}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4003/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 10

  subscriptions-api:
    <<: *api-common
    profiles: ["full"]
    build: ./services/subscriptions-api
    depends_on:
      identity-api:
        condition: service_healthy
      platform-db:
        condition: service_started
    environment: &platform-api-environment
      DB_SERVER: platform-db
      DB_PORT: 1433
      DB_USER: sa
      DB_PASSWORD: ${PLATFORM_DB_PASSWORD:?Ejecuta npm run setup:env}
      DB_ENCRYPT: "false"
      DB_TRUST_CERTIFICATE: "true"
      DB_POOL_MAX: 8
      IDENTITY_API_URL: http://identity-api:4001
      IDENTITY_TIMEOUT_MS: 3000
      SERVICE_API_KEY: ${SERVICE_API_KEY:?Ejecuta npm run setup:env}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-nutrimejor}:${RABBITMQ_PASSWORD:?Ejecuta npm run setup:env}@rabbitmq:5672
      DB_NAME: NutrimejorSubscriptions
      RUN_MIGRATIONS_ON_STARTUP: ${RUN_MIGRATIONS_ON_STARTUP:-true}

  clinical-api:
    <<: *api-common
    profiles: ["full"]
    build: ./services/clinical-api
    depends_on:
      identity-api: { condition: service_healthy }
      platform-db: { condition: service_started }
    environment:
      <<: *platform-api-environment
      DB_NAME: NutrimejorClinical

  measurements-api:
    <<: *api-common
    profiles: ["full"]
    build: ./services/measurements-api
    depends_on:
      identity-api: { condition: service_healthy }
      platform-db: { condition: service_started }
      subscriptions-api: { condition: service_healthy }
    environment:
      <<: *platform-api-environment
      DB_NAME: NutrimejorMeasurements
      SUBSCRIPTIONS_API_URL: http://subscriptions-api:4004
      EMAIL_API_URL: ${EMAIL_API_URL:-}
      EMAIL_API_KEY: ${EMAIL_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-NUTRIMEJOR <notificaciones@localhost>}
      WHATSAPP_ENABLED: ${WHATSAPP_ENABLED:-false}
      WHATSAPP_API_URL: ${WHATSAPP_API_URL:-}
      WHATSAPP_API_KEY: ${WHATSAPP_API_KEY:-}

  nutrition-api:
    <<: *api-common
    profiles: ["full"]
    build: ./services/nutrition-api
    depends_on:
      identity-api: { condition: service_healthy }
      platform-db: { condition: service_started }
      catalogs-api: { condition: service_healthy }
      subscriptions-api: { condition: service_healthy }
    environment:
      <<: *platform-api-environment
      DB_NAME: NutrimejorNutrition
      CATALOGS_API_URL: http://catalogs-api:4003
      SUBSCRIPTIONS_API_URL: http://subscriptions-api:4004

  planning-api:
    <<: *api-common
    profiles: ["full"]
    build: ./services/planning-api
    depends_on:
      identity-api: { condition: service_healthy }
      platform-db: { condition: service_started }
      catalogs-api: { condition: service_healthy }
      subscriptions-api: { condition: service_healthy }
    environment:
      <<: *platform-api-environment
      DB_NAME: NutrimejorPlanning
      CATALOGS_API_URL: http://catalogs-api:4003
      SUBSCRIPTIONS_API_URL: http://subscriptions-api:4004

  scheduling-api:
    <<: *api-common
    profiles: ["full"]
    build: ./services/scheduling-api
    depends_on:
      identity-api: { condition: service_healthy }
      platform-db: { condition: service_started }
      rabbitmq: { condition: service_started }
    environment:
      <<: *platform-api-environment
      DB_NAME: NutrimejorScheduling
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-nutrimejor}:${RABBITMQ_PASSWORD:?Ejecuta npm run setup:env}@rabbitmq:5672

  notifications-api:
    <<: *api-common
    profiles: ["full"]
    build: ./services/notifications-api
    depends_on:
      identity-api: { condition: service_healthy }
      platform-db: { condition: service_started }
      rabbitmq: { condition: service_started }
      subscriptions-api: { condition: service_healthy }
    environment:
      <<: *platform-api-environment
      DB_NAME: NutrimejorNotifications
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-nutrimejor}:${RABBITMQ_PASSWORD:?Ejecuta npm run setup:env}@rabbitmq:5672
      SUBSCRIPTIONS_API_URL: http://subscriptions-api:4004

  documents-api:
    <<: *api-common
    profiles: ["full"]
    build: ./services/documents-api
    depends_on:
      identity-api: { condition: service_healthy }
      platform-db: { condition: service_started }
      subscriptions-api: { condition: service_healthy }
    environment:
      <<: *platform-api-environment
      DB_NAME: NutrimejorDocuments
      OBJECT_STORAGE_PATH: /data/documents
      SUBSCRIPTIONS_API_URL: http://subscriptions-api:4004
    volumes:
      - documents_data:/data/documents

  reporting-api:
    <<: *api-common
    profiles: ["full"]
    build: ./services/reporting-api
    depends_on:
      identity-api: { condition: service_healthy }
      platform-db: { condition: service_started }
      rabbitmq: { condition: service_started }
    environment:
      <<: *platform-api-environment
      DB_NAME: NutrimejorReporting
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-nutrimejor}:${RABBITMQ_PASSWORD:?Ejecuta npm run setup:env}@rabbitmq:5672

  api-gateway:
    build: ./services/api-gateway
    restart: unless-stopped
    depends_on:
      identity-api: { condition: service_healthy }
      patients-api: { condition: service_healthy }
      catalogs-api: { condition: service_healthy }
    environment:
      PORT: 4080
      SERVICE_API_KEY: ${SERVICE_API_KEY:?Ejecuta npm run setup:env}
      JWT_ISSUER: ${JWT_ISSUER:-nutrimejor-identity}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-nutrimejor-services}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5050}
      GATEWAY_TIMEOUT_MS: ${GATEWAY_TIMEOUT_MS:-5000}
      GATEWAY_RETRIES: ${GATEWAY_RETRIES:-2}
      CIRCUIT_FAILURE_THRESHOLD: ${CIRCUIT_FAILURE_THRESHOLD:-5}
      CIRCUIT_OPEN_MS: ${CIRCUIT_OPEN_MS:-30000}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      IDENTITY_API_URL: http://identity-api:4001
      PATIENTS_API_URL: http://patients-api:4002
      CATALOGS_API_URL: http://catalogs-api:4003
      SUBSCRIPTIONS_API_URL: http://subscriptions-api:4004
      CLINICAL_API_URL: http://clinical-api:4005
      MEASUREMENTS_API_URL: http://measurements-api:4006
      NUTRITION_API_URL: http://nutrition-api:4007
      PLANNING_API_URL: http://planning-api:4008
      SCHEDULING_API_URL: http://scheduling-api:4009
      NOTIFICATIONS_API_URL: http://notifications-api:4010
      DOCUMENTS_API_URL: http://documents-api:4011
      REPORTING_API_URL: http://reporting-api:4012
    ports:
      - "127.0.0.1:4080:4080"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4080/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    depends_on:
      api-gateway: { condition: service_healthy }
    environment:
      NODE_ENV: production
      GATEWAY_API_URL: http://api-gateway:4080
      GATEWAY_TIMEOUT_MS: ${GATEWAY_TIMEOUT_MS:-5000}
      ACCESS_TOKEN_MINUTES: ${ACCESS_TOKEN_MINUTES:-10}
      REFRESH_TOKEN_DAYS: ${REFRESH_TOKEN_DAYS:-7}
    ports:
      - "3000:3000"

  razor-web:
    profiles: ["full"]
    build: ./frontend-razor/Nutrimejor.Web
    restart: unless-stopped
    depends_on:
      api-gateway: { condition: service_healthy }
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      GatewayBaseUrl: http://api-gateway:4080
    ports:
      - "5050:8080"

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.27.0
    profiles: ["full", "monitoring"]
    restart: unless-stopped
    command: ["--config.file=/etc/blackbox_exporter/config.yml"]
    volumes:
      - ./observability/blackbox/blackbox.yml:/etc/blackbox_exporter/config.yml:ro

  alertmanager:
    image: prom/alertmanager:v0.28.1
    profiles: ["full", "monitoring"]
    restart: unless-stopped
    command: ["--config.file=/etc/alertmanager/alertmanager.yml", "--storage.path=/alertmanager"]
    volumes:
      - ./observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    ports:
      - "127.0.0.1:9093:9093"

  prometheus:
    image: prom/prometheus:v3.14.0
    profiles: ["full", "monitoring"]
    restart: unless-stopped
    depends_on: [api-gateway, blackbox-exporter, alertmanager]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"

  loki:
    image: grafana/loki:3.7.3
    profiles: ["full", "monitoring"]
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes:
      - ./observability/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki_data:/loki

  alloy:
    image: grafana/alloy:v1.20.1
    profiles: ["full", "monitoring"]
    restart: unless-stopped
    depends_on: [loki]
    command: ["run", "/etc/alloy/config.alloy", "--server.http.listen-addr=0.0.0.0:12345"]
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - //var/run/docker.sock:/var/run/docker.sock:ro

  tempo:
    image: grafana/tempo:3.1.0
    profiles: ["full", "monitoring"]
    restart: unless-stopped
    command: ["-config.file=/etc/tempo/tempo.yml"]
    volumes:
      - ./observability/tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo_data:/var/tempo

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.161.0
    profiles: ["full", "monitoring"]
    restart: unless-stopped
    depends_on: [tempo]
    command: ["--config=/etc/otelcol-contrib/config.yml"]
    volumes:
      - ./observability/otel-collector/config.yml:/etc/otelcol-contrib/config.yml:ro

  grafana:
    image: grafana/grafana:13.2.2
    profiles: ["full", "monitoring"]
    restart: unless-stopped
    depends_on: [prometheus, loki, tempo, alertmanager]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Ejecuta npm run setup:env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:3001:3000"

volumes:
  identity_data:
  identity_keys:
  patients_data:
  catalogs_data:
  platform_data:
  rabbitmq_data:
  redis_data:
  documents_data:
  prometheus_data:
  alertmanager_data:
  loki_data:
  tempo_data:
  grafana_data:
