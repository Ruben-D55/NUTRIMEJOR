name: Publish versioned images

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      image_tag:
        description: Exact image tag (vX.Y.Z or sha-<40>)
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-images-${{ github.ref }}-${{ inputs.image_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      namespace: ${{ steps.release.outputs.namespace }}
    steps:
      - id: release
        shell: bash
        env:
          REQUESTED_TAG: ${{ inputs.image_tag || github.ref_name }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          if [[ ! "$REQUESTED_TAG" =~ ^(v[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.]+)?|sha-[0-9a-f]{40})$ ]]; then
            echo "La etiqueta debe ser vX.Y.Z o sha-<40 caracteres>." >&2
            exit 1
          fi
          echo "tag=$REQUESTED_TAG" >> "$GITHUB_OUTPUT"
          echo "namespace=$(echo "$REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

  publish:
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: identity-api
            context: services/identity-api
          - image: patients-api
            context: services/patients-api
          - image: catalogs-api
            context: services/catalogs-api
          - image: subscriptions-api
            context: services/subscriptions-api
          - image: clinical-api
            context: services/clinical-api
          - image: measurements-api
            context: services/measurements-api
          - image: nutrition-api
            context: services/nutrition-api
          - image: planning-api
            context: services/planning-api
          - image: scheduling-api
            context: services/scheduling-api
          - image: notifications-api
            context: services/notifications-api
          - image: documents-api
            context: services/documents-api
          - image: reporting-api
            context: services/reporting-api
          - image: api-gateway
            context: services/api-gateway
          - image: web
            context: .
          - image: razor-web
            context: frontend-razor/Nutrimejor.Web
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          pull: true
          provenance: mode=max
          sbom: true
          tags: ghcr.io/${{ needs.validate.outputs.namespace }}/nutrimejor-${{ matrix.image }}:${{ needs.validate.outputs.tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.validate.outputs.tag }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  manifest:
    needs: [validate, publish]
    runs-on: ubuntu-latest
    steps:
      - name: Record immutable release coordinates
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          IMAGE_NAMESPACE: ${{ needs.validate.outputs.namespace }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          mkdir release
          printf 'IMAGE_REGISTRY=ghcr.io\nIMAGE_NAMESPACE=%s\nIMAGE_TAG=%s\nGIT_SHA=%s\n' \
            "$IMAGE_NAMESPACE" "$RELEASE_TAG" "$RELEASE_SHA" > release/images.env
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ needs.validate.outputs.tag }}
          path: release/images.env
          retention-days: 90
