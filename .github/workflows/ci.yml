name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: npm ci
      - run: npm run setup:env
      - run: npm audit --omit=dev --audit-level=high
      - run: pip install openapi-spec-validator==0.7.2 PyYAML==6.0.2
      - run: npm run typecheck
      - run: npm run build
      - run: dotnet build frontend-razor/Nutrimejor.Web/Nutrimejor.Web.csproj --configuration Release
      - run: npm run test:services
      - run: python scripts/validate-openapi.py
      - run: python scripts/verify-architecture.py
      - run: docker compose config --quiet
      - run: docker compose --profile full config --quiet
      - run: docker compose --profile full build

  postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate PostgreSQL integration secret
        run: echo "POSTGRES_INTEGRATION_PASSWORD=$(openssl rand -hex 24)" >> "$GITHUB_ENV"
      - name: Start real PostgreSQL integration database
        run: docker compose -f tests/integration/docker-compose.postgres.yml up -d --wait --wait-timeout 120
      - name: Verify the twelve isolated service databases
        run: npm run test:integration:postgres
      - name: PostgreSQL logs
        if: failure()
        run: docker compose -f tests/integration/docker-compose.postgres.yml logs --no-color
      - name: Stop PostgreSQL integration database
        if: always()
        run: docker compose -f tests/integration/docker-compose.postgres.yml down -v

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Create ephemeral CI secrets
        run: npm run setup:env
      - name: Start the complete application
        run: docker compose --profile full up -d --build --wait --wait-timeout 420
      - name: Wait for the web application
        run: |
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:3000/login > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose --profile full logs --no-color --tail 100 web
          exit 1
      - name: Run browser journeys
        run: |
          set -a
          source .env
          set +a
          npm run test:e2e
        env:
          CI: true
          E2E_BASE_URL: http://127.0.0.1:3000
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14
      - name: Application logs
        if: failure()
        run: docker compose --profile full logs --no-color --tail 300
      - name: Stop the complete application
        if: always()
        run: docker compose --profile full down -v

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Review dependency changes
        if: github.event_name == 'pull_request'
        # GitHub omite esta API cuando el repositorio no expone Dependency Graph.
        # npm audit y Trivy continúan siendo controles obligatorios.
        continue-on-error: true
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
      - name: Scan source, dependencies and Docker configuration
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          version: v0.69.3
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Create ephemeral CI secrets
        run: npm run setup:env
      - name: Build application containers
        run: docker compose --profile full build
      - uses: aquasecurity/setup-trivy@3fb12ec12f41e471780db15c232d5dd185dcb514 # v0.2.6
        with:
          version: v0.69.3
          cache: true
      - name: Scan every application container
        shell: bash
        run: |
          mapfile -t images < <(docker image ls --format '{{.Repository}}:{{.Tag}}' | grep '^nutrimejor-' | sort -u)
          test ${#images[@]} -gt 0
          failed=0
          for image in "${images[@]}"; do
            trivy image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed "$image" || failed=1
          done
          exit "$failed"

  codeql:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript,csharp
      - run: npm ci
      - run: npm run build
      - run: dotnet build frontend-razor/Nutrimejor.Web/Nutrimejor.Web.csproj --configuration Release
      - uses: github/codeql-action/analyze@v3
