name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: pip install openapi-spec-validator==0.7.2 PyYAML==6.0.2
      - run: npm run typecheck
      - run: npm run build
      - run: dotnet build frontend-razor/Nutrimejor.Web/Nutrimejor.Web.csproj --configuration Release
      - run: npm run test:services
      - run: python scripts/validate-openapi.py
      - run: python scripts/verify-architecture.py
      - run: docker compose config --quiet
      - run: docker compose --profile full config --quiet
      - run: docker compose --profile full build
