name: nutrimejor-test

services:
  identity-api:
    environment:
      EXPOSE_DEVELOPMENT_TOKENS: "false"
      RUN_MIGRATIONS_ON_STARTUP: "false"
  web:
    ports: !reset
      - "127.0.0.1:${WEB_PORT:-3100}:3000"
    environment:
      NEXT_PUBLIC_APP_URL: ${APP_URL:-http://localhost:3100}
  api-gateway:
    ports: !reset
      - "127.0.0.1:${GATEWAY_PORT:-4180}:4080"
